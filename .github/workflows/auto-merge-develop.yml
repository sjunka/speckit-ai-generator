name: Auto-merge a develop

# Activa el auto-merge en los PRs que apuntan a develop.
# GitHub hace el merge solo cuando CI (conflict-check + build) pasa en verde.
# Para main NO se activa: ahí se exige 1 approval del equipo.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [develop]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Habilitar auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --squash --auto "${{ github.event.pull_request.html_url }}"
